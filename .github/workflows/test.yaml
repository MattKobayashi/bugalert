---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
permissions:
  contents: read
jobs:
  image:
    name: Image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: bugalert-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images
        run: docker compose --progress plain build --pull bugalert tests
      - name: Start image
        env:
          BUGALERT_ARISTA_TOKEN: ${{ secrets.BUGALERT_ARISTA_TOKEN }}
        run: |
          docker compose --progress plain up --wait --wait-timeout 60 bugalert
      - name: Run test suite
        run: docker compose --progress plain run --rm --no-deps -T tests
      - name: Show image logs on failure
        if: failure()
        run: docker compose logs --no-color bugalert
      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
name: Test
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
