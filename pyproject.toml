[project]
name = "bugalert"
version = "0.1.0"
description = "A live, version-aware Arista EOS bug and security advisory dashboard"
readme = "README.md"
authors = [
    { name = "Matthew Kobayashi", email = "matthew@kobayashi.au" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4,<1",
    "requests>=2.34.2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
bugalert = "bugalert:main"
bugalert-fetch = "bugalert.cli:fetch_main"

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=9,<10",
    "ruff>=0.17.4,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
